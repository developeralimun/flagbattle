<!DOCTYPE html>

<meta charset="UTF-8">
<title>🌍 Last Flag Standing Lottery - Bottom Deposit</title>
<style>
body{
  margin:0;
  background:#0a0f1f;
  font-family:Arial,sans-serif;
  color:white;
  text-align:center;
  overflow:hidden;
}
#arena{
  position:relative;
  width:90vw;
  height:160vw;
  max-width:400px;
  max-height:710px;
  margin:20px auto;
  border-radius:20px;
  border:3px solid white;
  overflow:hidden;
  background:#0a0f1f;
}
.flag{
  position:absolute;
  width:36px;
  height:26px;
  transition:all 0.5s ease;
}
#bottomLine{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:60px;
  display:flex;
  flex-wrap:wrap;
  align-items:flex-end;
  justify-content:flex-start;
  pointer-events:none;
  z-index:500;
}
#centerShow{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  pointer-events:none;
  z-index:1000;
}
#centerFlag{
  width:180px;
  display:none;
  animation:zoom 0.7s ease forwards;
}
#countryName{
  font-size:22px;
  margin-top:8px;
  display:none;
}
#nextCountryComment{
  font-size:18px;
  color:#ccc;
  margin-top:5px;
  display:none;
}
@keyframes zoom{
  from{transform:scale(0);}
  to{transform:scale(1);}
}
</style>
</head>

const arena=document.getElementById("arena");
const bottomLine=document.getElementById("bottomLine");
const centerFlag=document.getElementById("centerFlag");
const countryName=document.getElementById("countryName");
const nextComment=document.getElementById("nextCountryComment");

let flagsElements=[];

// CREATE FLAGS
function createFlags(){
  arena.innerHTML="";
  bottomLine.innerHTML="";
  flagsElements=[];
  countries.forEach(c=>{
    const f=document.createElement("img");
    f.src=`https://flagcdn.com/w80/${c.code}.png`;
    f.className="flag";
    f.dataset.name=c.name;
    f.dataset.code=c.code;
    f.style.left=Math.random()*(arena.offsetWidth-36)+"px";
    f.style.top=Math.random()*(arena.offsetHeight-86)+"px"; // leave space for bottom line
    arena.appendChild(f);
    flagsElements.push({el:f, dx:(Math.random()-0.5)*4, dy:(Math.random()-0.5)*4});
  });
  document.getElementById("remaining").innerText=flagsElements.length;
}

// MOVE FLAGS
function animateFlags(){
  flagsElements.forEach(f=>{
    let left=parseFloat(f.el.style.left)+f.dx;
    let top=parseFloat(f.el.style.top)+f.dy;
    if(left<0 || left>arena.offsetWidth-36) f.dx*=-1;
    if(top<0 || top>arena.offsetHeight-86) f.dy*=-1;
    f.el.style.left=parseFloat(f.el.style.left)+f.dx+"px";
    f.el.style.top=parseFloat(f.el.style.top)+f.dy+"px";
  });
  requestAnimationFrame(animateFlags);
}

// REMOVE FLAGS TO BOTTOM
function removeFlagsSequentially(){
  if(flagsElements.length<=1){
    showWinner(flagsElements[0].el.dataset);
    return;
  }
  const removeIndex=Math.floor(Math.random()*flagsElements.length);
  const removed=flagsElements.splice(removeIndex,1)[0];

  // move to bottom line
  removed.el.style.transition="all 0.3s linear";
  removed.el.style.bottom="0px";
  removed.el.style.top="auto";
  bottomLine.appendChild(removed.el);

  document.getElementById("remaining").innerText=flagsElements.length;
  setTimeout(removeFlagsSequentially, 300); // fast removal
}

// SHOW WINNER
function showWinner(winner){
  centerFlag.src=`https://flagcdn.com/w320/${winner.code}.png`;
  centerFlag.style.display="block";
  countryName.innerText="🏆 Winner: "+winner.name;
  countryName.style.display="block";
  nextComment.innerText="Next round soon...";
  nextComment.style.display="block";
  document.getElementById("winSound").play();
  setTimeout(()=>startLottery(),5000); // restart after 5 sec
}

// START LOTTERY
function startLottery(){
  createFlags();
  animateFlags();
  setTimeout(removeFlagsSequentially,1000); // start removing after 1s
}

window.onload=startLottery;
